version: "3.8"

services:
  mongodb:
    image: mongo:7-jammy
    container_name: bitdesk-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bitdesk
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bitdesk-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bitdesk-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bitdesk
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=docker_local_jwt_access_secret_123456789
      - JWT_REFRESH_SECRET=docker_local_jwt_refresh_secret_987654321
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bitdesk-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
